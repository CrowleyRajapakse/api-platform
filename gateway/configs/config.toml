
[analytics]
enabled = true
allow_payloads = false
enabled_publishers = ["moesif"]

[analytics.publishers.moesif]
application_id = "<MOESIF_APPLICATION_ID>"

[router]
gateway_host = "*"

# Public DNS helps Envoy resolve AAAA for IPv6-only upstreams when Docker’s resolver does not.
[router.upstream.dns]
resolvers = ["8.8.8.8:53", "1.1.1.1:53"]

[router.access_logs]
enabled = true

[controller.server]
gateway_id = "platform-gateway-id"

[controller.controlplane]
insecure_skip_verify = true

[controller.auth.basic]
enabled = true

[[controller.auth.basic.users]]
username = "admin"
password = "admin"
roles = ["admin"]
