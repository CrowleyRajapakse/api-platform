apiVersion: gateway.api-platform.wso2.com/v1alpha1
kind: ManagedSecret
metadata:
  name: demo-managed-secret-apim
  namespace: apigateway-demo-apim
  labels:
    gateway.api-platform.wso2.com/restapi-target: wso2-crd-apim
spec:
  displayName: demo-managed-secret-apim
  description: demo managed secret for APIM CRD flow
  value:
    valueFrom:
      secretKeyRef:
        name: demo-management-secrets-apim
        key: managed-secret-value
---
apiVersion: gateway.api-platform.wso2.com/v1alpha1
kind: LlmProviderTemplate
metadata:
  name: demo-llm-template-apim
  namespace: apigateway-demo-apim
  labels:
    gateway.api-platform.wso2.com/restapi-target: wso2-crd-apim
spec:
  displayName: demo-llm-template-apim
  promptTokens:
    identifier: usage.prompt_tokens
    location: payload
  completionTokens:
    identifier: usage.completion_tokens
    location: payload
  totalTokens:
    identifier: usage.total_tokens
    location: payload
---
apiVersion: gateway.api-platform.wso2.com/v1alpha1
kind: LlmProvider
metadata:
  name: demo-llm-provider-apim
  namespace: apigateway-demo-apim
  labels:
    gateway.api-platform.wso2.com/restapi-target: wso2-crd-apim
spec:
  displayName: demo-llm-provider-apim
  version: v1.0
  template: demo-llm-template-apim
  accessControl:
    mode: allow_all
  upstream:
    url: https://example-llm-upstream.invalid
    auth:
      type: api-key
      header: Authorization
      value:
        valueFrom:
          secretKeyRef:
            name: demo-management-secrets-apim
            key: provider-token
---
apiVersion: gateway.api-platform.wso2.com/v1alpha1
kind: LlmProxy
metadata:
  name: demo-llm-proxy-apim
  namespace: apigateway-demo-apim
  labels:
    gateway.api-platform.wso2.com/restapi-target: wso2-crd-apim
spec:
  displayName: demo-llm-proxy-apim
  version: v1.0
  provider:
    id: demo-llm-provider-apim
---
apiVersion: gateway.api-platform.wso2.com/v1alpha1
kind: Mcp
metadata:
  name: demo-mcp-apim
  namespace: apigateway-demo-apim
  labels:
    gateway.api-platform.wso2.com/restapi-target: wso2-crd-apim
spec:
  displayName: demo-mcp-apim
  version: v1.0
  upstream:
    url: https://example-mcp-upstream.invalid
---
apiVersion: gateway.api-platform.wso2.com/v1alpha1
kind: WebSubApi
metadata:
  name: demo-websub-apim
  namespace: apigateway-demo-apim
  labels:
    gateway.api-platform.wso2.com/restapi-target: wso2-crd-apim
spec:
  displayName: demo-websub-apim
  version: v1.0
  context: /websub-demo-apim
  hub:
    channels:
      - name: orders.created
---
apiVersion: gateway.api-platform.wso2.com/v1alpha1
kind: Certificate
metadata:
  name: demo-certificate-apim
  namespace: apigateway-demo-apim
  labels:
    gateway.api-platform.wso2.com/restapi-target: wso2-crd-apim
spec:
  displayName: demo-certificate-apim
  certificate:
    valueFrom:
      secretKeyRef:
        name: demo-management-secrets-apim
        key: cert.pem
---
apiVersion: gateway.api-platform.wso2.com/v1alpha1
kind: ApiKey
metadata:
  name: demo-restapi-apikey-apim
  namespace: apigateway-demo-apim
  labels:
    gateway.api-platform.wso2.com/restapi-target: wso2-crd-apim
spec:
  parentRef:
    kind: RestApi
    name: hello-normal-api-apim
  displayName: demo key for apim rest api parent
  expiresIn:
    duration: 30
    unit: days
---
apiVersion: gateway.api-platform.wso2.com/v1alpha1
kind: SubscriptionPlan
metadata:
  name: demo-plan-apim
  namespace: apigateway-demo-apim
  labels:
    gateway.api-platform.wso2.com/restapi-target: wso2-crd-apim
spec:
  planName: demo-plan-apim
  status: ACTIVE
  stopOnQuotaReach: true
  throttleLimitCount: 1000
  throttleLimitUnit: minutes
---
apiVersion: gateway.api-platform.wso2.com/v1alpha1
kind: Subscription
metadata:
  name: demo-subscription-apim
  namespace: apigateway-demo-apim
  labels:
    gateway.api-platform.wso2.com/restapi-target: wso2-crd-apim
spec:
  apiId: hello-normal-api-apim
  subscriptionPlanId: demo-plan-apim
  status: ACTIVE
  subscriptionToken:
    valueFrom:
      secretKeyRef:
        name: demo-management-secrets-apim
        key: subscription-token
