apiVersion: v1
kind: Secret
metadata:
  name: demo-management-secrets
  namespace: apigateway-demo
type: Opaque
stringData:
  provider-token: demo-provider-token
  managed-secret-value: demo-managed-secret-value
  cert.pem: |
    -----BEGIN CERTIFICATE-----
    MIIBszCCAVmgAwIBAgIUTk9ULVJFQUwtQ0VSVC1GT1ItREVNTy1PTkxZMAoGCCqGSM49BAMC
    MBMxETAPBgNVBAMMCGRlbW8tY2VydDAeFw0yNjAxMDEwMDAwMDBaFw0zNjAxMDEwMDAwMDBa
    MBMxETAPBgNVBAMMCGRlbW8tY2VydDBZMBMGByqGSM49AgEGCCqGSM49AwEHA0IABDemoflow
    No0qKcG9N4j7r5hP1h3uQhK6B0fVQjvYq1tV8u0sQY4z6Xv5xX8b4n5kL7u2m9vH0r6mQ8t3
    3N5R8tP9e0qjUzBRMB0GA1UdDgQWBBQdemoonlydemoonlydemoonlydemoonlydemoajAf
    BgNVHSMEGDAWgBQdemoonlydemoonlydemoonlydemoonlydemoaMA8GA1UdEwEB/wQFMAMB
    Af8wCgYIKoZIzj0EAwIDSAAwRQIhANOTREALCERTFORDEMOONLYNOTFORPRODUCTION
    AiA5NOTREALCERTFORDEMOONLYNOTFORPRODUCTION=
