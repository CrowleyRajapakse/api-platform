  subscription-token: demo-subscription-token-1234567890-abcdef
---
apiVersion: gateway.api-platform.wso2.com/v1alpha1
kind: ManagedSecret
metadata:
  name: demo-managed-secret
  namespace: apigateway-demo
  labels:
    gateway.api-platform.wso2.com/restapi-target: wso2-crd
spec:
  displayName: demo-managed-secret
  description: demo managed secret for CRD flow
  value:
    valueFrom:
      secretKeyRef:
        name: demo-management-secrets
        key: managed-secret-value
---
apiVersion: gateway.api-platform.wso2.com/v1alpha1
kind: LlmProviderTemplate
metadata:
  name: demo-llm-template
  namespace: apigateway-demo
  labels:
    gateway.api-platform.wso2.com/restapi-target: wso2-crd
spec:
  displayName: demo-llm-template
  promptTokens:
    identifier: usage.prompt_tokens
    location: payload
  completionTokens:
    identifier: usage.completion_tokens
    location: payload
  totalTokens:
    identifier: usage.total_tokens
    location: payload
---
apiVersion: gateway.api-platform.wso2.com/v1alpha1
kind: LlmProvider
metadata:
  name: demo-llm-provider
  namespace: apigateway-demo
  labels:
    gateway.api-platform.wso2.com/restapi-target: wso2-crd
spec:
  displayName: demo-llm-provider
  version: v1.0
  template: demo-llm-template
  accessControl:
    mode: allow_all
  upstream:
    url: https://example-llm-upstream.invalid
    auth:
      type: api-key
      header: Authorization
      value:
        valueFrom:
          secretKeyRef:
            name: demo-management-secrets
            key: provider-token
---
apiVersion: gateway.api-platform.wso2.com/v1alpha1
kind: LlmProxy
metadata:
  name: demo-llm-proxy
  namespace: apigateway-demo
  labels:
    gateway.api-platform.wso2.com/restapi-target: wso2-crd
spec:
  displayName: demo-llm-proxy
  version: v1.0
  provider:
    id: demo-llm-provider
---
apiVersion: gateway.api-platform.wso2.com/v1alpha1
kind: Mcp
metadata:
  name: demo-mcp
  namespace: apigateway-demo
  labels:
    gateway.api-platform.wso2.com/restapi-target: wso2-crd
spec:
  displayName: demo-mcp
  version: v1.0
  upstream:
    url: https://example-mcp-upstream.invalid
---
apiVersion: gateway.api-platform.wso2.com/v1alpha1
kind: WebSubApi
metadata:
  name: demo-websub
  namespace: apigateway-demo
  labels:
    gateway.api-platform.wso2.com/restapi-target: wso2-crd
spec:
  displayName: demo-websub
  version: v1.0
  context: /websub-demo
  hub:
    channels:
      - name: orders.created
---
apiVersion: gateway.api-platform.wso2.com/v1alpha1
kind: Certificate
metadata:
  name: demo-certificate
  namespace: apigateway-demo
  labels:
    gateway.api-platform.wso2.com/restapi-target: wso2-crd
spec:
  displayName: demo-certificate
  certificate:
    valueFrom:
      secretKeyRef:
        name: demo-management-secrets
        key: cert.pem
---
apiVersion: gateway.api-platform.wso2.com/v1alpha1
kind: ApiKey
metadata:
  name: demo-restapi-apikey
  namespace: apigateway-demo
  labels:
    gateway.api-platform.wso2.com/restapi-target: wso2-crd
spec:
  parentRef:
    kind: RestApi
    name: hello-normal-api
  displayName: demo key for rest api parent
  expiresIn:
    duration: 30
    unit: days
---
apiVersion: gateway.api-platform.wso2.com/v1alpha1
kind: SubscriptionPlan
metadata:
  name: demo-plan
  namespace: apigateway-demo
  labels:
    gateway.api-platform.wso2.com/restapi-target: wso2-crd
spec:
  planName: demo-plan
  status: ACTIVE
  stopOnQuotaReach: true
  throttleLimitCount: 1000
  throttleLimitUnit: minutes
---
apiVersion: gateway.api-platform.wso2.com/v1alpha1
kind: Subscription
metadata:
  name: demo-subscription
  namespace: apigateway-demo
  labels:
    gateway.api-platform.wso2.com/restapi-target: wso2-crd
spec:
  apiId: hello-normal-api
  subscriptionPlanId: demo-plan
  status: ACTIVE
  subscriptionToken:
    valueFrom:
      secretKeyRef:
        name: demo-management-secrets
        key: subscription-token
