---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.5
  name: websubapis.gateway.api-platform.wso2.com
spec:
  group: gateway.api-platform.wso2.com
  names:
    kind: WebSubApi
    listKind: WebSubApiList
    plural: websubapis
    shortNames:
    - wsapi
    singular: websubapi
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: WebSubApi is the Schema for the websubapis API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: WebhookAPIData mirrors the management-API WebhookAPIData
              payload.
            properties:
              context:
                description: Context is the base path for all routes (must start with
                  /).
                pattern: ^/[a-zA-Z0-9\-._~!$&'()*+,;=:@%/]*[^/]$
                type: string
              delivery:
                description: Delivery configures outbound subscriber delivery.
                properties:
                  policies:
                    description: Policies lists policies applied to subscriber delivery
                      requests.
                    items:
                      description: Policy defines a policy attachment as embedded
                        in RestApi or APIConfigData.
                      properties:
                        executionCondition:
                          description: ExecutionCondition Expression controlling conditional
                            execution of the policy
                          type: string
                        name:
                          description: Name Name of the policy
                          type: string
                        params:
                          description: Params Arbitrary parameters for the policy
                            (free-form key/value structure)
                          x-kubernetes-preserve-unknown-fields: true
                        version:
                          description: Version Semantic version of the policy (for
                            example, v1)
                          pattern: ^v\d+$
                          type: string
                      required:
                      - name
                      - version
                      type: object
                    type: array
                type: object
              deploymentState:
                description: DeploymentState toggles whether the API is router-attached.
                enum:
                - deployed
                - undeployed
                type: string
              displayName:
                description: DisplayName is a human-readable API name.
                type: string
              hub:
                description: Hub configures subscriber management and fan-out.
                properties:
                  channels:
                    description: Channels lists topics available for subscription.
                    items:
                      description: HubChannel is a single subscribable topic exposed
                        by the WebSub hub.
                      properties:
                        name:
                          description: Name is the channel name.
                          type: string
                        policies:
                          description: Policies lists channel-scoped policies (e.g.
                            rbac).
                          items:
                            description: Policy defines a policy attachment as embedded
                              in RestApi or APIConfigData.
                            properties:
                              executionCondition:
                                description: ExecutionCondition Expression controlling
                                  conditional execution of the policy
                                type: string
                              name:
                                description: Name Name of the policy
                                type: string
                              params:
                                description: Params Arbitrary parameters for the policy
                                  (free-form key/value structure)
                                x-kubernetes-preserve-unknown-fields: true
                              version:
                                description: Version Semantic version of the policy
                                  (for example, v1)
                                pattern: ^v\d+$
                                type: string
                            required:
                            - name
                            - version
                            type: object
                          type: array
                      required:
                      - name
                      type: object
                    minItems: 1
                    type: array
                  policies:
                    description: Policies lists hub-level policies (e.g. api-key-auth).
                    items:
                      description: Policy defines a policy attachment as embedded
                        in RestApi or APIConfigData.
                      properties:
                        executionCondition:
                          description: ExecutionCondition Expression controlling conditional
                            execution of the policy
                          type: string
                        name:
                          description: Name Name of the policy
                          type: string
                        params:
                          description: Params Arbitrary parameters for the policy
                            (free-form key/value structure)
                          x-kubernetes-preserve-unknown-fields: true
                        version:
                          description: Version Semantic version of the policy (for
                            example, v1)
                          pattern: ^v\d+$
                          type: string
                      required:
                      - name
                      - version
                      type: object
                    type: array
                required:
                - channels
                type: object
              receiver:
                description: Receiver configures inbound publisher webhook handling.
                properties:
                  policies:
                    description: Policies lists policies applied to inbound webhook
                      requests.
                    items:
                      description: Policy defines a policy attachment as embedded
                        in RestApi or APIConfigData.
                      properties:
                        executionCondition:
                          description: ExecutionCondition Expression controlling conditional
                            execution of the policy
                          type: string
                        name:
                          description: Name Name of the policy
                          type: string
                        params:
                          description: Params Arbitrary parameters for the policy
                            (free-form key/value structure)
                          x-kubernetes-preserve-unknown-fields: true
                        version:
                          description: Version Semantic version of the policy (for
                            example, v1)
                          pattern: ^v\d+$
                          type: string
                      required:
                      - name
                      - version
                      type: object
                    type: array
                type: object
              version:
                description: Version is the API semantic version.
                pattern: ^v?([0-9]+)(\.[0-9]+)?(\.[0-9]+)?(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$
                type: string
              vhosts:
                description: Vhosts is an optional VhostConfig for the WebSub API.
                properties:
                  main:
                    description: Main Custom virtual host/domain for production traffic
                    type: string
                  sandbox:
                    description: Sandbox Custom virtual host/domain for sandbox traffic
                    type: string
                required:
                - main
                type: object
            required:
            - context
            - displayName
            - hub
            - version
            type: object
          status:
            description: |-
              ResourceStatus carries the controller-managed lifecycle fields shared by
              the new management-API CRDs.

              For UUID-keyed kinds (Subscription, SubscriptionPlan, Certificate) the
              gateway-controller assigns Id on first deploy; controllers persist it and
              use it to address the resource for subsequent update/delete calls.
            properties:
              conditions:
                description: |-
                  Conditions represent the latest available observations of the
                  resource's state. The standard types are Accepted and Programmed.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              id:
                description: |-
                  Id is the gateway-issued identifier for UUID-keyed resources. When
                  set the controller addresses the resource via PUT/DELETE /<plural>/{id}.
                type: string
              lastUpdateTime:
                description: LastUpdateTime is the last time the status was updated.
                format: date-time
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
